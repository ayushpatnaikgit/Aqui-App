// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        // react-native-usb-serialport-for-android reads these; without them it
        // compiles against SDK 30 and fails on android:attr/lStar (AndroidX >= 1.7).
        UsbSerialportForAndroid_compileSdkVersion = compileSdkVersion
        UsbSerialportForAndroid_targetSdkVersion = targetSdkVersion
        UsbSerialportForAndroid_minSdkVersion = minSdkVersion
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
